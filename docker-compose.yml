services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coreteam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coreteam-local}
      POSTGRES_DB: coreteam
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coreteam -d coreteam"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./web-demo
    restart: unless-stopped
    environment:
      PORT: 4173
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://coreteam:${POSTGRES_PASSWORD:-coreteam-local}@db:5432/coreteam
      STORAGE_TOKEN: ${STORAGE_TOKEN:-development-storage-token}
      DATA_DIR: /var/lib/coreteam/web
      ARTIFACT_REPO_PATH: /var/lib/coreteam/artifacts
    ports:
      - "4173:4173"
    volumes:
      - web_data:/var/lib/coreteam/web
      - artifact_git:/var/lib/coreteam/artifacts
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  web_data:
  artifact_git:
