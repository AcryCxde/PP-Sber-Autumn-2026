[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-web-backend"
version = "0.1.0"
description = "FastAPI backend for the Claude web application"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "boto3>=1.35,<2",
    "docker>=7.1,<8",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.18,<1",
    "openpyxl>=3.1,<4",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0,<2",
    "reportlab>=4.4,<5",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
