name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'AcryCxde/PP-Sber-Autumn-2026' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      request: ${{ steps.verify.outputs.request }}
    steps:
      - name: Refuse disabled or untrusted deployment
        env:
          DEPLOY_ENABLED: ${{ vars.CICD_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_ENABLED" != true ]]; then
            printf '%s\n' 'Deployment disabled: CICD_DEPLOY_ENABLED must be true.' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != refs/heads/master || "$GITHUB_REPOSITORY" != AcryCxde/PP-Sber-Autumn-2026 ]]; then
            printf '%s\n' 'Refused: only official repository master deployment is allowed.' >&2
            exit 1
          fi
      # Never load tools or scripts from the selected release SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AcryCxde/PP-Sber-Autumn-2026
          ref: refs/heads/master
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify upstream CI and immutable release provenance
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          CICD_DEPLOY_ENABLED: ${{ vars.CICD_DEPLOY_ENABLED }}
          # workflow_run uses the verified upstream head_sha, never GITHUB_SHA.
          # Manual retry discovers the exact current master push release.
        run: |
          set -euo pipefail
          request=$(python -m tools.cicd.verify_release)
          printf 'request=%s\n' "$request" >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/master' && vars.CICD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      # No checkout or executable artifact in the credential-bearing job.
      # The root-owned forced-command wrapper independently re-verifies under lock.
      - name: Send bounded release JSON to reviewed server wrapper
        env:
          RELEASE_JSON: ${{ needs.verify.outputs.request }}
          DEPLOY_HOST: ${{ secrets.CICD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.CICD_DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.CICD_DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.CICD_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CICD_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          # Bound input before arithmetic; no default port or implicit SSH config.
          [[ -n "${DEPLOY_PORT:-}" && ${#DEPLOY_PORT} -le 5 ]] || exit 1
          [[ "$DEPLOY_PORT" =~ ^[1-9][0-9]*$ ]] || exit 1
          (( DEPLOY_PORT <= 65535 )) || exit 1
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 1
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 1
          [[ -n "$DEPLOY_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          [[ -n "$RELEASE_JSON" && ${#RELEASE_JSON} -le 16360 ]]
          directory=$(mktemp -d)
          trap 'rm -rf "$directory"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$directory/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$directory/known_hosts"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          printf '{"schema":2,"release":%s}\n' "$RELEASE_JSON" | ssh -F /dev/null -T -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$directory/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i "$directory/key" "$DEPLOY_USER@$DEPLOY_HOST" /usr/local/sbin/coreteams-deploy
      - name: Verify external HTTPS after the server opens traffic
        run: |
          set -euo pipefail
          origin=https://coreteams.2026.tochka-urfu.tech
          for path in / /product/; do
            curl --fail --silent --show-error --retry 3 --max-time 20 "$origin$path" >/dev/null
          done
          status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$origin/api/admin/v1/users")
          [[ "$status" == 401 ]]
