name: Private package metadata preflight

# Read-only owner metadata check, not evidence of a published release. No checkout or artifacts.
on:
  workflow_dispatch:

permissions: {}

jobs:
  metadata:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'AcryCxde/PP-Sber-Autumn-2026' &&
          github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check exact private package metadata using owner read-only token
        env:
          GHCR_METADATA_OWNER_TOKEN: ${{ secrets.CICD_GHCR_METADATA_OWNER_READ_TOKEN }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate key")
                  result[key] = value
              return result

          name = "pp-sber-autumn-2026-backend"
          status = None
          category = "credential"
          try:
              token = os.environ.get("GHCR_METADATA_OWNER_TOKEN", "")
              if not token or not all(33 <= ord(c) <= 126 for c in token):
                  raise ValueError("credential")
              opener = urllib.request.build_opener(NoRedirect())
              for suffix in ("backend", "frontend", "runner"):
                  name = "pp-sber-autumn-2026-" + suffix
                  status = None
                  category = "network"
                  request = urllib.request.Request(
                      "https://api.github.com/user/packages/container/" + name,
                      headers={
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                          "Authorization": "Bearer " + token,
                      },
                  )
                  with opener.open(request, timeout=20) as response:
                      status = response.status
                      category = "http"
                      if status != 200:
                          raise ValueError("response")
                      category = "malformed"
                      data = response.read(65537)
                      if len(data) > 65536:
                          raise ValueError("response")
                  data = json.loads(data.decode("utf-8"), object_pairs_hook=unique)
                  category = "metadata"
                  if not (
                      isinstance(data, dict)
                      and data.get("name") == name
                      and data.get("package_type") == "container"
                      and data.get("visibility") == "private"
                      and isinstance(data.get("owner"), dict)
                      and data["owner"].get("login") == "AcryCxde"
                  ):
                      raise ValueError("metadata")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"package={name} class=http http={error.code}") from None
          except (OSError, TimeoutError, urllib.error.URLError):
              raise SystemExit(f"package={name} class=network http=none") from None
          except ValueError:
              code = status if status is not None else "none"
              raise SystemExit(f"package={name} class={category} http={code}") from None
          print("All three exact private packages verified; no uploads performed")
          PY
