name: Private package metadata preflight

# Read-only experiment, not evidence of a published release. No checkout or artifacts.
on:
  workflow_dispatch:

permissions:
  packages: read

jobs:
  metadata:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'AcryCxde/PP-Sber-Autumn-2026' &&
          github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check exact private package metadata using Actions token
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate key")
                  result[key] = value
              return result

          try:
              token = os.environ.get("GHCR_TOKEN", "")
              if not token or not all(33 <= ord(c) <= 126 for c in token):
                  raise ValueError("credential")
              opener = urllib.request.build_opener(NoRedirect())
              for suffix in ("backend", "frontend", "runner"):
                  name = "pp-sber-autumn-2026-" + suffix
                  request = urllib.request.Request(
                      "https://api.github.com/users/AcryCxde/packages/container/" + name,
                      headers={
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                          "Authorization": "Bearer " + token,
                      },
                  )
                  with opener.open(request, timeout=20) as response:
                      data = response.read(65537)
                      if response.status != 200 or len(data) > 65536:
                          raise ValueError("response")
                  data = json.loads(data.decode("utf-8"), object_pairs_hook=unique)
                  if not (
                      isinstance(data, dict)
                      and data.get("name") == name
                      and data.get("package_type") == "container"
                      and data.get("visibility") == "private"
                      and isinstance(data.get("owner"), dict)
                      and data["owner"].get("login") == "AcryCxde"
                  ):
                      raise ValueError("metadata")
          except (ValueError, OSError, TimeoutError, urllib.error.URLError):
              raise SystemExit("Private package metadata preflight failed; no uploads performed") from None
          print("All three exact private packages readable with Actions token; no uploads performed")
          PY
