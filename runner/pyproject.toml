[project]
name = "ctrunner"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["claude-agent-sdk==0.2.158"]

[project.scripts]
ctrunner = "ctrunner.main:cli"
ctrunner-healthcheck = "ctrunner.healthcheck:cli"
ctrunner-inbox = "ctrunner.inbox:cli"
sessions = "ctrunner.sessions:cli"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctrunner"]

[tool.pytest.ini_options]
addopts = "-W error --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: нужны Docker и cliproxy"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC", "PL"]
# RUF001-003: кириллица в строках и комментариях — язык проекта, а не опечатка.
ignore = ["PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# S108: в тестах /tmp — значение политики сторожа, а не временный файл.
# S105/S106: в тестах фиктивные токены.
"tests/**" = ["S101", "PLR2004", "S108", "S105", "S106"]
"evals/**" = ["S101", "S603", "S607"]

[tool.mypy]
strict = true
warn_unreachable = true
