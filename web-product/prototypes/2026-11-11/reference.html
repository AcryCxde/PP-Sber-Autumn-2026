section[aria-labelledby="workspace-title"] .chat-message p{font-size:14px}
@media(max-width:1100px){.work-grid:has(#workspace-title){max-width:850px;grid-template-columns:minmax(0,1fr)}}

/* Реплики у противоположных сторон с небольшим зазором от рамки. */
.chat-thread{padding-left:18px;padding-right:18px}
.chat-pair{width:100%;align-self:stretch}
@media(max-width:760px){.chat-thread{padding-left:14px;padding-right:14px}}

/* Команда, план и выбор результата помещаются в рабочем экране. */
.team-page .lead{margin-bottom:11px}
.team-page .workspace-summary{padding:10px 14px;margin-bottom:13px}
.team-decision-grid,.team-output-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.team-pane,.team-option-pane{padding:16px 18px;min-width:0}
.team-pane .section-kicker,.team-option-pane .section-kicker{font-size:11px;margin-bottom:4px}
.team-pane .section-title,.team-option-pane .section-title{font-size:17px;margin-bottom:11px}
.team-pane-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.team-pane-head .section-title{margin-bottom:0}
.team-pane-head .button{flex:none;min-height:34px;padding:7px 11px}
.team-list{display:grid;gap:7px}
.team-role-row{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border:1px solid #e2e9e5;border-radius:10px;background:#fcfdfc}
.team-role-row.added{background:#f4faf5;border-color:#b7d9c0}
.team-role-number{display:grid;place-items:center;width:27px;height:27px;flex:none;border-radius:7px;background:#eef2ff;color:#2459e8;font-size:11px;font-weight:800}
.team-role-row.added .team-role-number{background:#e6f4e9;color:#2b7252}
.team-role-row>div{min-width:0;flex:1}
.team-role-row strong{display:block;font-size:13px;line-height:1.25}
.team-role-row p{font-size:12px;line-height:1.3;color:#60767a;margin:3px 0 0}
.team-added-label{color:#287049;font-size:11px;font-weight:720;white-space:nowrap}
.team-pane .mini-form{padding:12px;margin-top:10px}
.team-pane .plan-steps{gap:0}
.team-pane .plan-step{padding:10px 0;gap:10px}
.team-pane .plan-step:first-child{padding-top:2px}
.team-pane .plan-step strong{font-size:13px}
.team-pane .plan-step small{font-size:12px;margin-top:2px;line-height:1.35}
.team-pane .change-row{margin-top:10px}
.team-output-grid{margin-top:12px}
.team-output-grid.single{grid-template-columns:minmax(0,1fr)}
.team-option-pane .output-choice-grid{gap:8px}
.team-option-pane .output-choice{min-height:65px;padding:10px 12px}
.team-option-pane .output-choice strong{font-size:13px}
.team-option-pane .output-choice span{font-size:11px}
.team-option-pane .helper{margin-top:9px}
.team-option-pane .format-option{padding:8px 11px}
.team-confirm-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid #dce6df;border-radius:12px;background:#f8fbf8;padding:11px 15px;margin-top:12px}
.team-confirm-bar span{color:#60767a;font-size:12px;line-height:1.4}
.team-confirm-bar .button{flex:none;min-height:38px;padding:9px 15px}
@media(max-width:1000px){.team-decision-grid,.team-output-grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){.team-pane,.team-option-pane{padding:14px}.team-confirm-bar{align-items:stretch;flex-direction:column}.team-confirm-bar .button{width:100%}.team-pane-head .button{width:auto}}

.team-pane .plan-step>div{min-width:0}
.plan-step-roles{display:block;margin-top:3px;color:#3b745c;font-size:11px;line-height:1.35;overflow-wrap:anywhere}
.plan-change-note{margin-top:8px;color:#286c49;font-size:12px;line-height:1.4}
.plan-editor{display:grid;gap:10px;margin-top:10px}
.plan-edit-step{min-width:0;margin:0;border:1px solid #dfe8e2;border-radius:10px;padding:10px 11px;background:#fcfdfc}
.plan-edit-step legend{padding:0 5px;color:#426c59;font-size:11px;font-weight:780}
.plan-edit-step .field-label{font-size:11px;margin:6px 0 4px}
.plan-edit-step .input{padding:8px 10px;font-size:13px}
.plan-role-options{display:flex;flex-wrap:wrap;gap:5px}
.plan-role-check{display:inline-flex;align-items:center;gap:5px;border:1px solid #d8e2dc;border-radius:8px;background:#fff;padding:5px 7px;color:#3d5b57;font-size:11px;line-height:1.3;cursor:pointer}
.plan-role-check input{width:14px;height:14px;margin:0;accent-color:var(--accent)}
.plan-editor-actions{display:flex;flex-wrap:wrap;gap:7px}
.plan-editor-actions .button{min-height:34px}
.team-confirm-bar .button.secondary{background:transparent}
@media(max-width:760px){.team-confirm-bar .button.secondary{order:2}.team-confirm-bar .button.primary{order:1}.team-confirm-bar span{order:3}.plan-editor-actions .button{width:100%}}

.result-skill-artifact{border:1px solid #b9d3c3;border-radius:14px;background:#f5faf6;padding:15px 16px;margin-bottom:9px}
.result-skill-head{display:flex;align-items:center;gap:11px}
.result-skill-icon{display:grid;place-items:center;flex:none;width:43px;height:43px;border-radius:9px;background:#dff0e4;color:#276b48;font-size:11px;font-weight:850;letter-spacing:.04em}
.result-skill-head>div{min-width:0}
.result-skill-head strong{display:block;font-size:15px;line-height:1.3}
.result-skill-head small{display:block;margin-top:3px;color:#527265;font-size:11px;line-height:1.35}
.result-skill-artifact>p:not(.helper){font-size:12px;line-height:1.4;color:#46655a;margin:10px 0}
.result-skill-artifact .skill-actions{gap:7px;margin-top:9px}
.result-skill-artifact .skill-actions .button{flex:1;white-space:nowrap}
.result-skill-artifact .helper{font-size:11px;margin-top:8px}
@media(max-width:760px){.result-skill-artifact .skill-actions .button{width:100%;flex:auto}}
@media(max-width:1400px){.result-dialog .chat-input-row{grid-template-columns:38px minmax(0,1fr)}.result-dialog .chat-input-row .chat-actions{grid-column:1/-1;flex-direction:row;justify-content:flex-end;margin-top:2px}.result-dialog .chat-input-row .chat-actions .button{min-height:32px;padding:7px 9px}}

/* Схема согласованного плана: подсветка и передача между этапами. */
.work-page{height:auto;min-height:100%}
.work-page .lead{margin-bottom:12px}
.work-honesty{align-items:center}
.flow-board{margin-top:12px;border:1px solid #dbe7e1;border-radius:17px;background:#fff;padding:15px;box-shadow:0 8px 24px rgba(23,58,57,.035)}
.flow-board-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
.flow-board-head strong{font-size:15px}
.flow-board-head span{font-size:12px;color:#53766b;font-weight:750}
.flow-map{display:flex;align-items:stretch;gap:0}
.flow-step{flex:1;min-width:0;min-height:190px;display:flex;align-items:flex-start;gap:9px;border:1px solid #dce6e2;border-radius:13px;background:#fafcfb;padding:13px;transition:background .35s,border-color .35s,box-shadow .35s,transform .35s}
.flow-step.complete{background:#f4faf6;border-color:#bcd9c5}
.flow-step.current{background:linear-gradient(145deg,#f2f6ff,#f8fcf9);border-color:#8faaf5;box-shadow:0 0 0 3px #2459e812,0 12px 30px #2459e813;transform:translateY(-2px);animation:flowBreath 3.2s ease-in-out infinite}
.flow-step.pending{opacity:.63}
.flow-step-number{display:grid;place-items:center;flex:none;width:27px;height:27px;border-radius:8px;background:#e9f0ed;color:#577268;font-size:11px;font-weight:800}
.flow-step.current .flow-step-number{background:#2459e8;color:#fff}
.flow-step.complete .flow-step-number{background:#dff2e4;color:#2a704d}
.flow-step-content{min-width:0}
.flow-step-state{display:block;margin:1px 0 9px;color:#698078;font-size:11px;font-weight:800;letter-spacing:.02em}
.flow-step.current .flow-step-state{color:#2459e8}
.flow-step.complete .flow-step-state{color:#2d7550}
.flow-step h2{font-size:15px;line-height:1.28;letter-spacing:-.025em;margin:0 0 7px}
.flow-step p{font-size:12px;line-height:1.4;color:#607579;margin:0 0 13px}
.flow-agents{display:flex;flex-wrap:wrap;gap:6px}
.flow-agent{display:inline-flex;align-items:center;gap:5px;border:1px solid #d7e2dc;border-radius:999px;background:#fff;padding:4px 7px;color:#48615d;font-size:11px;line-height:1.2;font-weight:700;overflow-wrap:anywhere}
.flow-agent i{width:7px;height:7px;flex:none;border-radius:50%;background:#a9bcb3}
.flow-step.current .flow-agent{border-color:#b7c8fa;color:#1f4b9b;box-shadow:0 0 0 2px #2459e80c}
.flow-step.current .flow-agent i{background:#2459e8;box-shadow:0 0 0 3px #2459e81a;animation:agentGlow 2.5s ease-in-out infinite}
.flow-step.complete .flow-agent i{background:#4e9e6c}
.flow-connector{position:relative;display:block;flex:0 0 35px;align-self:center;height:22px;color:#b4c6be}
.flow-line{position:absolute;left:0;right:7px;top:10px;height:2px;background:#d5e1da}
.flow-arrow{position:absolute;right:0;top:1px;font-size:21px;line-height:21px;font-weight:700}
.flow-connector.passed{color:#2e8c60}
.flow-connector.passed .flow-line{background:#76bf91}
.flow-connector.handoff .flow-packet{position:absolute;left:0;top:6px;width:9px;height:9px;border-radius:50%;background:#2459e8;box-shadow:0 0 0 5px #2459e81c;animation:flowTransfer 2.1s ease-in-out infinite}
.flow-current{display:flex;align-items:flex-start;gap:13px;margin-top:11px;border:1px solid #d9e6de;border-radius:13px;background:#f7faf8;padding:12px 15px}
.flow-current-symbol{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:9px;background:#e5f2e8;color:#2c7950;font-size:16px}
.flow-current small{display:block;color:#57816a;font-size:10px;font-weight:800;letter-spacing:.06em;margin:1px 0 4px}
.flow-current strong{font-size:14px}
.flow-current p{font-size:12px;line-height:1.4;color:#57706b;margin:5px 0 0}
.work-footer{margin-top:auto;justify-content:space-between;flex-wrap:wrap;gap:10px}
@keyframes flowBreath{50%{box-shadow:0 0 0 4px #2459e820,0 14px 32px #2459e81b}}
@keyframes agentGlow{50%{box-shadow:0 0 0 5px #2459e824}}
@keyframes flowTransfer{0%{transform:translateX(0);opacity:0}18%{opacity:1}82%{opacity:1}100%{transform:translateX(23px);opacity:0}}
@media(max-width:900px){.flow-map{flex-direction:column}.flow-step{min-height:0}.flow-connector{align-self:center;flex:none;width:24px;height:32px;transform:rotate(90deg)}.flow-board{padding:14px}.flow-step p{margin-bottom:9px}}
@media(prefers-reduced-motion:reduce){.flow-step.current,.flow-step.current .flow-agent i,.flow-connector.handoff .flow-packet{animation:none}.flow-step{transition:none}}

/* На узком экране внутренние колонки не расширяют рабочее пространство. */
.main-shell{grid-template-columns:minmax(0,1fr)}
@media(max-width:420px){.topbar-left{display:none}.topbar-actions{width:100%;justify-content:space-between}.work-grid{min-width:0}.role-card{min-width:0}}

/* Скилл — основной артефакт технического пути, поэтому виден до диалога. */
.with-skill>.result-skill-artifact{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"head actions" "detail actions" "note actions";align-items:center;column-gap:20px;row-gap:3px;margin:14px 0 0;padding:14px 17px}
.with-skill>.result-skill-artifact .result-skill-head{grid-area:head}
.with-skill>.result-skill-artifact>p:not(.helper){grid-area:detail;margin:0 0 0 54px}
.with-skill>.result-skill-artifact .skill-actions{grid-area:actions;display:flex;flex-direction:column;align-items:stretch;min-width:180px;margin:0}
.with-skill>.result-skill-artifact .helper{grid-area:note;margin:0 0 0 54px}
.with-skill .result-dashboard{height:min(440px,calc(100dvh - 330px));min-height:350px}
@media(max-width:760px){.with-skill>.result-skill-artifact{display:block;padding:14px}.with-skill>.result-skill-artifact>p:not(.helper){margin:9px 0}.with-skill>.result-skill-artifact .skill-actions{margin-top:10px}.with-skill>.result-skill-artifact .helper{margin:8px 0 0}.with-skill .result-dashboard{height:auto;min-height:0}}

</style>
</head>
<body>
  <a class="skip-link" href="#main-content">К содержимому</a>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
/* Локальные шаблоны файлов CoreTeams. Они оформляют введённые данные, но не анализируют их. */
(() => {
  'use strict';
  const theme = Object.freeze({ ink: '152B35', blue: '2459E8', green: '29644C', pale: 'EAF2ED', muted: '61757A', white: 'FFFFFF' });
  const xml = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' })[c]);
  const encoder = new TextEncoder();
  function crc32(bytes) {
    let value = 0xffffffff;
    for (const byte of bytes) { value ^= byte; for (let i = 0; i < 8; i++) value = (value >>> 1) ^ (value & 1 ? 0xedb88320 : 0); }
    return (value ^ 0xffffffff) >>> 0;
  }
  function zip(files, mime) {
    const local = [], central = [];
    let offset = 0, centralSize = 0;
    for (const [path, content] of Object.entries(files)) {
      const name = encoder.encode(path), bytes = typeof content === 'string' ? encoder.encode(content) : content;
      const checksum = crc32(bytes), a = new Uint8Array(30 + name.length), av = new DataView(a.buffer);
      av.setUint32(0, 0x04034b50, true); av.setUint16(4, 20, true); av.setUint16(6, 0x0800, true);
      av.setUint32(14, checksum, true); av.setUint32(18, bytes.length, true); av.setUint32(22, bytes.length, true); av.setUint16(26, name.length, true); a.set(name, 30);
      const b = new Uint8Array(46 + name.length), bv = new DataView(b.buffer);
      bv.setUint32(0, 0x02014b50, true); bv.setUint16(4, 20, true); bv.setUint16(6, 20, true); bv.setUint16(8, 0x0800, true);
      bv.setUint32(16, checksum, true); bv.setUint32(20, bytes.length, true); bv.setUint32(24, bytes.length, true); bv.setUint16(28, name.length, true); bv.setUint32(42, offset, true); b.set(name, 46);
      local.push(a, bytes); central.push(b); offset += a.length + bytes.length; centralSize += b.length;
    }
    const end = new Uint8Array(22), ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, central.length, true); ev.setUint16(10, central.length, true); ev.setUint32(12, centralSize, true); ev.setUint32(16, offset, true);
    return new Blob([...local, ...central, end], { type: mime });
  }
  const rootRels = officeType => `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="${officeType}"/></Relationships>`;
  const coreProps = model => `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>${xml(model.title)}</dc:title><dc:creator>CoreTeams</dc:creator><dc:description>Локальный макет без анализа и серверного сохранения</dc:description></cp:coreProperties>`;

  function docx(model) {
    const para = (text, style = 'Normal') => `<w:p><w:pPr><w:pStyle w:val="${style}"/></w:pPr><w:r><w:t xml:space="preserve">${xml(text)}</w:t></w:r></w:p>`;
    const body = [para('CORETEAMS · РЕЗУЛЬТАТ', 'Kicker'), para(model.title, 'Title'), para(`${model.date} · ${model.persona} · версия ${model.version}`, 'Subtitle'), para('Локальный макет. Анализ файлов и работа агентов не выполнялись.', 'Notice'), ...model.sections.flatMap(section => [para(section.title, 'Heading1'), ...section.lines.map(line => para(line))])].join('');
    const files = {
      '[Content_Types].xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`,
      '_rels/.rels': rootRels('word/document.xml'),
      'docProps/core.xml': coreProps(model),
      'word/_rels/document.xml.rels': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`,
      'word/document.xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1100" w:right="1150" w:bottom="1100" w:left="1150" w:header="500" w:footer="500" w:gutter="0"/></w:sectPr></w:body></w:document>`,
      'word/styles.xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Aptos" w:hAnsi="Aptos" w:cs="Arial"/><w:sz w:val="22"/><w:color w:val="${theme.ink}"/></w:rPr></w:rPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:pPr><w:spacing w:after="160" w:line="320" w:lineRule="auto"/></w:pPr></w:style><w:style w:type="paragraph" w:styleId="Kicker"><w:name w:val="Kicker"/><w:basedOn w:val="Normal"/><w:rPr><w:b/><w:color w:val="${theme.green}"/><w:sz w:val="18"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:before="180" w:after="260"/></w:pPr><w:rPr><w:b/><w:color w:val="${theme.ink}"/><w:sz w:val="42"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Subtitle"><w:name w:val="Subtitle"/><w:basedOn w:val="Normal"/><w:rPr><w:color w:val="${theme.muted}"/><w:sz w:val="20"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Notice"><w:name w:val="Notice"/><w:basedOn w:val="Normal"/><w:rPr><w:color w:val="${theme.muted}"/><w:i/><w:sz w:val="18"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:before="320" w:after="130"/></w:pPr><w:rPr><w:b/><w:color w:val="${theme.blue}"/><w:sz w:val="28"/></w:rPr></w:style></w:styles>`
    };
    return zip(files, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
  }

  function xlsx(model) {
    const rows = [
      [model.title, ''], [`Версия ${model.version} · ${model.date}`, model.persona],
      ['Локальный макет', 'Анализ файлов и работа агентов не выполнялись.'],
      ...model.sections.flatMap(section => [[section.title, ''], ...section.lines.flatMap(line => (String(line).match(/[\s\S]{1,30000}/g) || ['']).map(part => ['', part]))])
    ];
    const cell = (col, row, value, style) => `<c r="${col}${row}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xml(value)}</t></is></c>`;
    const sheetRows = rows.map((values, i) => `<row r="${i + 1}" ht="${i === 0 ? 34 : 29}" customHeight="1">${cell('A', i + 1, values[0], i === 0 ? 1 : values[0] && !values[1] ? 2 : 0)}${cell('B', i + 1, values[1], 0)}</row>`).join('');
    const files = {

  let view = 'workspace';
  let pendingDeleteId = null;
  let dialogReturn = null;
  let selectedFile = null;
  let toastTimer;

  function loadLibrary() {
    try {
      const raw = JSON.parse(localStorage.getItem(LIBRARY_KEY) || '[]');
      if (!Array.isArray(raw)) return [];
      const expires = Date.now() - TRASH_DAYS * 24 * 60 * 60 * 1000;
      const valid = raw.filter(item => item && item.id && item.state &&
        (item.status === 'active' || (item.status === 'trash' && Date.parse(item.deletedAt) > expires)));
      if (valid.length !== raw.length) localStorage.setItem(LIBRARY_KEY, JSON.stringify(valid));
      return valid;
    } catch { return []; }
  }
  function hasProjectContent(project) {
    return Boolean(project.role || project.brief?.trim() || project.context?.trim() || project.versions?.length);
  }
  function activeProjects() { return library.filter(item => item.status === 'active'); }
  function versionCount(count) {
    const word = { one: 'версия', few: 'версии', many: 'версий' }[new Intl.PluralRules('ru-RU').select(count)] || 'версий';
    return `${count} ${word}`;
  }
  function projectTitle(project) { return project.brief?.trim() || (project.role ? `Новый проект · ${roleInfo[project.role]?.name || 'без названия'}` : 'Новый проект'); }
  function projectSnapshot(project) {
    return { ...project, dialog: null, notice: '', showRoleForm: false, showPlanForm: false, showChangeForm: false };
  }
  function saveCurrentInLibrary() {
    if (!hasProjectContent(state)) return;
    const existing = library.find(item => item.id === state.projectId);
    if (existing?.status === 'trash') return;
    const entry = {
      id: state.projectId, status: 'active', updatedAt: new Date().toISOString(),
      state: projectSnapshot(state)
    };
    if (existing) Object.assign(existing, entry);
    else library.unshift(entry);
    localStorage.setItem(LIBRARY_KEY, JSON.stringify(library));
  }

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!raw || typeof raw !== 'object') return fresh();
      const extraRoles = Array.isArray(raw.extraRoles) ? raw.extraRoles : [];
      const skills = Array.isArray(raw.skills) ? raw.skills : [];
      const dialogue = Array.isArray(raw.dialogue) ? raw.dialogue : [
        ...(raw.answer ? [{ question: roleInfo[raw.role]?.facilitator || 'Что нужно проверить?', answer: raw.answer }] : []),
        ...(raw.context ? [{ question: 'Какие условия уже известны?', answer: raw.context }] : [])
      ];
      const resultDialogue = Array.isArray(raw.resultDialogue) ? raw.resultDialogue : [];
      const versions = Array.isArray(raw.versions) ? raw.versions.map(item => ({
        ...item,
        snapshot: item.snapshot || {
          role: raw.role, brief: raw.brief || '', context: raw.context || '',
          answer: raw.answer || '', extraRoles: [...extraRoles], format: raw.format || 'pdf'
        }
      })) : [];
      const planEdits = raw.planEdits && typeof raw.planEdits === 'object' && !Array.isArray(raw.planEdits) ? raw.planEdits : {};
      const project = { ...fresh(), ...raw, projectId: raw.projectId || projectId(), extraRoles, versions, skills, dialogue, resultDialogue, planEdits };
      if (library.some(item => item.id === project.projectId && item.status === 'trash')) {
        return activeProjects()[0]?.state || fresh();
      }
      return project;
    } catch { return fresh(); }
  }
  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      saveCurrentInLibrary();
    } catch { announce('Не удалось сохранить черновик в этом браузере. Проверьте доступное место.'); }
  }
  function set(patch) { state = { ...state, ...patch }; persist(); render(); }
  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
  }
  function role() { return roleInfo[state.role] || null; }
  function briefShort() {
    const text = state.brief.trim();
    return text.length > 48 ? `${text.slice(0, 47)}…` : text;
  }
  function announce(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 4300);
  }
  function currentStageIndex() { return Math.max(0, stages.indexOf(state.stage)); }
  function canOpen(index) {
    if (index === 0) return true;
    if (!state.role || !state.brief.trim()) return false;
    if (index === 1) return true;
    if (state.dialogue.length < 4 && !state.versions.length) return false;
    if (index === 2) return true;
    if (index === 3) return state.versions.length > 0;
    const stepCount = state.versions.at(-1)?.snapshot?.plan?.length || currentPlanSteps().length;
    return state.versions.length > 0 && (state.workStep === 0 || state.workStep >= stepCount || state.stage === 'result');
  }

  function sidebar() {
    return `<aside class="sidebar" aria-label="Навигация по проекту">
      <a class="brand" href="?" data-action="go-start" aria-label="CoreTeams — начало">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>coreteams</span>
      </a>
      <button class="projects-link ${view === 'projects' ? 'active' : ''}" data-action="show-projects" ${view === 'projects' ? 'aria-current="page"' : ''}>Мои проекты <span>${activeProjects().length} / ${PROJECT_LIMIT}</span></button>
      <div><p class="sidebar-caption">Рабочее пространство</p><nav class="nav-list" aria-label="Этапы">
        ${stages.map((item, index) => `<button class="nav-button ${view === 'workspace' && state.stage === item ? 'active' : ''}" data-stage="${item}" ${canOpen(index) ? '' : 'disabled'} ${view === 'workspace' && state.stage === item ? 'aria-current="step"' : ''}><span class="nav-num">${index + 1}</span>${stageNames[index]}</button>`).join('')}
      </nav></div>
      <div class="sidebar-bottom"><div class="draft-note"><strong>Локальные проекты</strong>Остаются только в этом браузере. На сервере не сохранены.</div></div>
    </aside>`;
  }

  function topbar() {
    const actions = view === 'projects'
      ? `<button class="text-button" data-action="return-project">${hasProjectContent(state) ? 'Вернуться к проекту' : 'К новому проекту'}</button>`
      : hasProjectContent(state)
        ? '<button class="text-button" data-action="new-project">Новый проект</button><button class="small-button" data-action="open-save">Сохранить проект</button>'
        : activeProjects().length ? '<button class="text-button" data-action="show-projects">Вернуться к проекту</button>' : '';
    return `<header class="topbar">
      <div class="topbar-left"><span class="project-label">${view === 'projects' ? 'Мои проекты' : state.brief ? esc(briefShort()) : 'Новый проект'}</span><span class="topbar-dot"></span><span class="topbar-sub">В этом браузере</span></div>
      <div class="topbar-actions">${actions}<button class="text-button account-entry" data-action="open-register">Регистрация / вход</button></div>
    </header>`;
  }

  function projectsPage() {
    const active = activeProjects().sort((a, b) => Date.parse(b.updatedAt) - Date.parse(a.updatedAt));
    const trash = library.filter(item => item.status === 'trash').sort((a, b) => Date.parse(b.deletedAt) - Date.parse(a.deletedAt));
    const date = value => new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(value));
    return `<section aria-labelledby="projects-title" class="projects-page">
      <p class="eyebrow">ПРОЕКТЫ НА ЭТОМ УСТРОЙСТВЕ</p><h1 class="page-title" id="projects-title">Мои проекты</h1>
      <p class="lead">Откройте проект, чтобы продолжить с того же этапа. Черновики и версии остаются только в этом браузере.</p>
      <div class="projects-section-head"><h2 class="section-title">Активные · ${active.length} из ${PROJECT_LIMIT}</h2><button class="button primary small" data-action="new-project" ${active.length >= PROJECT_LIMIT ? 'disabled' : ''}>Новый проект</button></div>
      ${active.length >= PROJECT_LIMIT ? '<p class="helper projects-helper">Достигнут лимит 5 активных проектов. Переместите один в корзину, чтобы создать новый.</p>' : ''}
      ${active.length ? `<div class="project-list">${active.map(item => `<article class="project-row"><div class="project-details"><h3>${esc(projectTitle(item.state))}</h3><p>${esc(roleInfo[item.state.role]?.name || 'Роль ещё не выбрана')} · ${versionCount(item.state.versions?.length || 0)}${item.state.skills?.length ? ' · скилл в проекте' : ''} · изменён ${date(item.updatedAt)}${item.id === state.projectId ? ' · сейчас открыт' : ''}</p></div><div class="project-actions"><button class="button secondary small" data-action="open-project" data-project-id="${esc(item.id)}">Открыть проект</button><button class="button danger small" data-action="delete-project" data-project-id="${esc(item.id)}">Удалить</button></div></article>`).join('')}</div>` : '<div class="empty-projects">Пока нет проектов. Начните с описания продукта и решения.</div>'}
      <div class="projects-section-head trash-head"><h2 class="section-title">Корзина · ${trash.length}</h2></div>
      <p class="helper projects-helper">Удалённые проекты остаются здесь до 30 дней и не занимают место среди активных.</p>
      ${trash.length ? `<div class="project-list">${trash.map(item => `<article class="project-row trashed"><div class="project-details"><h3>${esc(projectTitle(item.state))}</h3><p>Удалён ${date(item.deletedAt)} · ${versionCount(item.state.versions?.length || 0)}</p></div><div class="project-actions"><button class="button secondary small" data-action="restore-project" data-project-id="${esc(item.id)}" ${active.length >= PROJECT_LIMIT ? 'disabled title="Сначала удалите один из активных проектов"' : ''}>Восстановить</button></div></article>`).join('')}</div>` : '<p class="helper">Корзина пуста.</p>'}
    </section>`;
  }

  function stageAside() {
    const index = currentStageIndex();
    let next = ['Опишите задачу по продукту', 'Ответьте на вопросы фасилитатора', 'Подтвердите команду и план', 'Посмотрите ход работы', 'Обсудите результат и следующий шаг'][index];
    if (index === 1 && state.dialogue.length >= 4) next = 'Посмотреть команду и план';
    if (index === 3) next = state.workStep >= (state.versions.at(-1)?.snapshot?.plan?.length || 3) ? 'Открыть результат' : 'Показать передачу дальше';
    if (index === 4 && state.resultDialogue.length >= 3) next = 'Создать новую версию';
    return `<aside class="aside ${state.asideCollapsed ? 'collapsed' : ''}" aria-label="Состояние работы">
      <div class="aside-head"><h3>Сейчас</h3><button class="aside-toggle" data-action="toggle-aside" aria-label="${state.asideCollapsed ? 'Развернуть' : 'Свернуть'} правую панель">${state.asideCollapsed ? '⟩' : '⟨'}</button></div>
      <div class="aside-body"><div class="aside-item"><small>Этап</small><strong>${stageNames[index]}</strong></div><div class="aside-item"><small>Следующий шаг</small><strong>${next}</strong></div><div class="aside-item"><small>Лимит демо</small><strong>Число кредитов уточняется</strong></div></div>
    </aside>`;
  }

  function startPage() {
    const info = role();
    return `<section aria-labelledby="start-title">
      <p class="eyebrow">CORETEAMS · НОВЫЙ ПРОЕКТ</p>
      <h1 class="page-title" id="start-title">Опишите сложную задачу по продукту — <em>получите решение.</em></h1>
      <p class="lead">CoreTeams задаст уточняющие вопросы, предложит состав команды и подготовит файл с выводами, допущениями и следующим шагом.</p>
      <div class="section-block"><p class="section-kicker">01 / ВАША РОЛЬ В ЭТОМ ПРОЕКТЕ</p><h2 class="section-title">Как вы участвуете в решении?</h2>
        <div class="role-grid">
          ${Object.entries(roleInfo).map(([key, item], index) => `<article class="role-card ${state.role === key ? 'selected' : ''}"><span class="role-symbol" aria-hidden="true">${index === 0 ? '◇' : '⌘'}</span><h3>${esc(item.name)}</h3><p>${esc(item.short)}</p><button class="button primary small" data-action="select-role" data-role="${key}">${state.role === key ? 'Выбрано ✓' : 'Выбрать →'}</button></article>`).join('')}
        </div>
      </div>
      <div class="brief-box" id="brief-section"><p class="section-kicker">02 / СУТЬ ЗАДАЧИ</p><h2 class="section-title">${info ? 'Назовите продукт и решение' : 'Сначала выберите роль'}</h2>
        ${info ? `<label class="field-label" for="brief">${esc(info.question)}</label><textarea class="textarea" id="brief" maxlength="1000" placeholder="${esc(info.placeholder)}">${esc(state.brief)}</textarea><p class="helper">Достаточно сути. Срок, бюджет, материалы и файлы добавите на следующем экране.</p><div class="examples" aria-label="Примеры"><span class="helper">Примеры:</span>${info.examples.map((example, index) => `<button class="example-chip" data-action="example" data-index="${index}">${esc(example)}</button>`).join('')}</div>` : `<p class="helper">Роль нужна только для этого проекта. Для следующего проекта её можно выбрать заново.</p>`}
        <p class="error" id="start-error" role="alert"></p><div class="form-actions"><button class="button primary" data-action="start-work" ${info ? '' : 'disabled'}>Разобрать задачу <span aria-hidden="true">↗</span></button><span class="notice-line">Вход не нужен для знакомства с рабочим пространством.</span></div>
      </div>
    </section>`;
  }

  function questionFor(kind, count) {
    const questions = kind === 'result'
      ? ['Что в результате хотите уточнить или улучшить?', 'Какой новый факт, отзыв или ограничение стоит учесть?', 'Какой вывод или следующий шаг вы ожидаете от новой версии?']
      : role()?.questions || [];
    if (kind === 'initial' && count === 2) {
      const known = [state.brief, ...state.dialogue.map(item => item.answer)].join(' ').toLowerCase();
      const hasTime = /срок|недел|месяц|дней|дня|год|квартал/.test(known);
      const hasMoney = /бюджет|рубл|руб\b|₽|аренд|стоимост|миллион|тысяч/.test(known);
      if (hasTime && hasMoney) return 'Какие ещё ограничения или зависимости влияют на выбор?';
      if (hasTime) return 'Какой бюджет и какие другие ограничения влияют на выбор?';
      if (hasMoney) return 'Какие сроки и другие условия влияют на выбор?';
    }
    if (count < questions.length) return questions[count];
    const followups = kind === 'result'
      ? ['Что ещё важно учесть в следующей версии?', 'Что из нового нужно проверить перед следующим шагом?', 'Какие замечания к результату остались?']
      : ['Есть ли альтернативный вариант, с которым нужно сравнить решение?', 'Кого затронет решение и кто сможет подтвердить результат?', 'Какие материалы или факты могут появиться позже?'];
    return followups[(count - questions.length) % followups.length];
  }

  function facilitatorChat(kind) {
    const initial = kind === 'initial';
    const entries = initial ? state.dialogue : state.resultDialogue;
    const ready = entries.length >= (initial ? 4 : 3);
    const draft = initial ? state.dialogueDraft : state.resultDialogueDraft;
    const question = questionFor(kind, entries.length);
    const formId = initial ? 'initial-chat-form' : 'result-chat-form';
    const inputId = initial ? 'initial-chat-input' : 'result-chat-input';
    return `<div class="facilitator-chat surface" id="facilitator-chat" aria-label="Диалог с фасилитатором">
      <div class="chat-header"><div class="question-top"><span class="facilitator-icon" aria-hidden="true">✳</span><div><strong>Фасилитатор</strong><small>${ready ? (initial ? 'Основные вопросы пройдены. Можно добавить детали.' : 'Вводные для новой версии собраны. Можно добавить детали.') : 'Демо: вопросы по сценарию, без анализа ответов'}</small></div></div>${ready ? `<div class="chat-head-actions"><button class="button primary" data-action="${initial ? 'to-team' : 'create-next-version'}">${initial ? 'Посмотреть команду и план →' : 'Создать новую версию →'}</button></div>` : ''}</div>
      <div class="chat-thread" role="log" aria-live="polite" aria-label="История диалога">
        ${entries.map(item => `<div class="chat-pair"><div class="chat-message facilitator"><small>Фасилитатор</small><p>${esc(item.question)}</p></div><div class="chat-message user"><small>Вы</small><p>${esc(item.answer)}</p></div></div>`).join('')}
        <div class="chat-pair current-pair"><div class="chat-message facilitator current"><small>Фасилитатор · вопрос ${entries.length + 1}</small><p>${esc(question)}</p></div></div>
      </div>
      <form id="${formId}" class="chat-composer"><div class="chat-label-row"><label class="field-label" for="${inputId}">Ваш ответ</label><small>Enter — отправить · Shift+Enter — новая строка</small></div><div class="chat-input-row"><button class="chat-attach-button" type="button" data-action="select-file" aria-label="Добавить файл" title="Добавить файл" data-tooltip="Добавить файл"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m20.5 11.5-8.8 8.8a5 5 0 0 1-7.1-7.1l9.2-9.2a3.5 3.5 0 0 1 5 5l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button><textarea id="${inputId}" class="textarea" maxlength="2000" rows="3" placeholder="Ответьте своими словами; можно добавить факты, сомнения и ограничения">${esc(draft)}</textarea><div class="chat-actions"><button class="button primary" type="submit">Отправить ответ ↗</button><button class="button quiet" type="button" data-action="chat-unknown" data-kind="${kind}">Пока не знаю</button></div></div><input class="visually-hidden" type="file" id="source-file" tabindex="-1" aria-label="Выберите файл для макета"><p class="chat-file-status" id="file-status" ${selectedFile ? '' : 'hidden'}>${selectedFile ? `Выбран: ${esc(selectedFile)}. Файл не загружен и не анализировался.` : ''}</p></form>
    </div>`;
  }

  function workspacePage() {
    const info = role();
    return `<section aria-labelledby="workspace-title">
      <p class="eyebrow">УТОЧНЕНИЕ · ШАГ 1</p><h1 class="page-title" id="workspace-title">Расскажите о задаче <em>своими словами.</em></h1>
      <p class="lead">Фасилитатор задаёт вопросы по одному прямо здесь. Добавляйте детали, пока вводных не хватит для плана.</p>
      <div class="workspace-summary"><small>ВАША ЗАДАЧА · ${esc(info.name)}</small><strong>${esc(state.brief)}</strong></div>
      ${facilitatorChat('initial')}
    </section>`;
  }

  function defaultPlanSteps(roleKey = state.role, extraRoles = state.extraRoles) {
    const info = roleInfo[roleKey];
    if (!info) return [];
    const [first, second, facilitator] = info.team.map(item => item[0]);
    return [
      {
        title: 'Уточнить основания',
        detail: roleKey === 'implementer' ? 'Зафиксировать технический вопрос, данные и ограничения' : 'Собрать факты, критерий решения и ограничения',
        roles: [facilitator]
      },
      {
        title: 'Проверить варианты и риски',
        detail: roleKey === 'implementer' ? 'Сопоставить технические варианты, зависимости и риски' : 'Сравнить варианты и обозначить пробелы в данных',
        roles: [first, second, ...extraRoles.map(item => item.name)]
      },
      {
        title: 'Собрать результат',
        detail: 'Зафиксировать выводы, неизвестное и следующий шаг',
        roles: [facilitator]
      }
    ];
  }

  function currentPlanSteps() {
    const available = new Set([...roleInfo[state.role].team.map(item => item[0]), ...state.extraRoles.map(item => item.name)]);
    return defaultPlanSteps().map((step, index) => {
      const edit = state.planEdits?.[index] || {};
      const roles = Array.isArray(edit.roles) ? edit.roles.filter(name => available.has(name)) : step.roles;
      return { title: edit.title || step.title, detail: edit.detail || step.detail, roles: roles.length ? roles : step.roles };
    });
  }

  function planEditor() {
    const names = [...roleInfo[state.role].team.map(item => item[0]), ...state.extraRoles.map(item => item.name)];
    return `<form id="plan-form" class="plan-editor">${currentPlanSteps().map((step, index) => `<fieldset class="plan-edit-step"><legend>Шаг ${index + 1}</legend><label class="field-label" for="plan-title-${index}">Название</label><input class="input" id="plan-title-${index}" name="plan-title-${index}" maxlength="80" value="${esc(step.title)}" required><label class="field-label" for="plan-detail-${index}">Что сделать</label><input class="input" id="plan-detail-${index}" name="plan-detail-${index}" maxlength="180" value="${esc(step.detail)}" required><span class="field-label">Кто участвует</span><div class="plan-role-options">${names.map(name => `<label class="plan-role-check"><input type="checkbox" name="plan-role-${index}" value="${esc(name)}" ${step.roles.includes(name) ? 'checked' : ''}><span>${esc(name)}</span></label>`).join('')}</div></fieldset>`).join('')}<div class="plan-editor-actions"><button class="button primary small" type="submit">Завершить редактирование</button><button class="button secondary small" type="button" data-action="cancel-plan-edit">Вернуться без изменений</button></div></form>`;
  }

  function teamPage() {
    const info = role();
    const allRoles = [...info.team.map(([name, task]) => ({ name, task, added: false })), ...state.extraRoles.map(item => ({ ...item, added: true }))];
    return `<section class="team-page" aria-labelledby="team-title">
      <p class="eyebrow">КОМАНДА И ПЛАН · ШАГ 2</p><h1 class="page-title" id="team-title">Соберите проверку <em>вместе.</em></h1><p class="lead">Проверьте роли и план, затем выберите результат.</p>
      <div class="workspace-summary"><small>ЗАДАЧА · ${esc(info.name)}</small><strong>${esc(state.brief)}</strong></div>
      <div class="team-decision-grid">
        <div class="team-pane surface"><div class="team-pane-head"><div><p class="section-kicker">01 / КОМАНДА</p><h2 class="section-title">Кто участвует</h2></div><button class="button secondary small" data-action="show-role-form" aria-expanded="${state.showRoleForm}">+ Добавить роль</button></div>
          <div class="team-list">${allRoles.map((item, index) => `<article class="team-role-row ${item.added ? 'added' : ''}"><span class="team-role-number" aria-hidden="true">${item.added ? '+' : String(index + 1).padStart(2, '0')}</span><div><strong>${esc(item.name)}</strong><p>${esc(item.task)}</p></div>${item.added ? '<span class="team-added-label">Добавлена</span>' : ''}</article>`).join('')}</div>
          ${state.showRoleForm ? `<form class="mini-form" id="role-form"><label class="field-label" for="role-name">Название роли</label><input class="input" id="role-name" name="roleName" maxlength="60" placeholder="Например, дизайнер" required><label class="field-label" for="role-task">Что она должна проверить или подготовить?</label><input class="input" id="role-task" name="roleTask" maxlength="160" placeholder="Например, проверить понятность первого экрана" required><button class="button primary small" type="submit">Добавить в состав</button><p class="helper">Роль добавится в состав макета. Агент не запускается.</p></form>` : ''}
        </div>
        <div class="team-pane surface"><div class="team-pane-head"><div><p class="section-kicker">02 / ПЛАН</p><h2 class="section-title">Как проверим</h2></div><button class="button secondary small" data-action="${state.showPlanForm ? 'cancel-plan-edit' : 'edit-plan'}" aria-expanded="${state.showPlanForm}">${state.showPlanForm ? 'Закрыть' : 'Поправить план'}</button></div>
          ${state.showPlanForm ? planEditor() : `<div class="plan-steps">${currentPlanSteps().map((step, index) => `<div class="plan-step"><b>${String(index + 1).padStart(2, '0')}</b><div><strong>${esc(step.title)}</strong><small>${esc(step.detail)}</small><span class="plan-step-roles">${esc(step.roles.join(' · '))}</span></div></div>`).join('')}</div>`}
          ${state.extraRoles.length && !state.showPlanForm ? `<div class="plan-change-note">Новая роль «${esc(state.extraRoles.at(-1).name)}» учтена в плане.</div>` : ''}
        </div>
      </div>
      <div class="team-output-grid ${state.role === 'implementer' ? '' : 'single'}">
        ${state.role === 'implementer' ? `<div class="team-option-pane surface"><p class="section-kicker">03 / ТИП РЕЗУЛЬТАТА</p><h2 class="section-title">Что подготовить</h2><div class="output-choice-grid" role="group" aria-label="Тип результата"><button class="output-choice ${state.outputType === 'document' ? 'selected' : ''}" data-action="output-type" data-output-type="document" aria-pressed="${state.outputType === 'document'}"><strong>Документ</strong><span>Выводы и план проверки</span></button><button class="output-choice ${state.outputType === 'skill' ? 'selected' : ''}" data-action="output-type" data-output-type="skill" aria-pressed="${state.outputType === 'skill'}"><strong>Создать скилл</strong><span>Файл SKILL.md и архив с примерами</span></button></div><p class="helper">Скилл в макете сохраняется как черновик; пробный запуск недоступен.</p></div>` : ''}
        <div class="team-option-pane surface"><p class="section-kicker">${state.role === 'implementer' ? '04' : '03'} / ФОРМАТ ФАЙЛА</p><h2 class="section-title">${state.outputType === 'skill' ? 'Формат отчёта' : 'Формат результата'}</h2><div class="format-grid" role="group" aria-label="Формат результата">${['pdf', 'docx', 'pptx', 'xlsx', 'md'].map(format => `<button class="format-option ${state.format === format ? 'active' : ''}" data-action="format" data-format="${format}" aria-pressed="${state.format === format}">${format.toUpperCase()}</button>`).join('')}</div><p class="helper">Файл создаётся локально в браузере по шаблону.</p></div>
      </div>
      <div class="team-confirm-bar"><button class="button secondary" data-action="back-to-questions">← Вернуться к вопросам</button><span>Это предложение макета. Агенты не запускались.</span><button class="button primary" data-action="confirm-plan" ${state.showPlanForm ? 'disabled title="Сначала завершите редактирование плана"' : ''}>Согласовать план и продолжить →</button></div>
    </section>`;
  }

  function workPage() {
    const agreedPlan = state.versions.at(-1)?.snapshot.plan || currentPlanSteps();
    const visible = Math.max(1, Math.min(state.workStep || 1, agreedPlan.length));
    const current = agreedPlan[visible - 1];
    const flow = agreedPlan.map((step, index) => {
      const status = index < visible - 1 ? 'complete' : index === visible - 1 ? 'current' : 'pending';
      const names = step.roles?.length ? step.roles : ['Роль не назначена'];
      return `<div class="flow-step ${status}" ${status === 'current' ? 'aria-current="step"' : ''}><span class="flow-step-number">${String(index + 1).padStart(2, '0')}</span><div class="flow-step-content"><span class="flow-step-state">${status === 'complete' ? 'Передано дальше' : status === 'current' ? 'Показан сейчас' : 'Следующий этап'}</span><h2>${esc(step.title)}</h2><div class="flow-agents" aria-label="Участники этапа">${names.map(name => `<span class="flow-agent"><i aria-hidden="true"></i>${esc(name)}</span>`).join('')}</div></div></div>${index < agreedPlan.length - 1 ? `<span class="flow-connector ${index < visible - 1 ? 'passed' : ''} ${index === visible - 2 ? 'handoff' : ''}" aria-hidden="true"><span class="flow-line"></span><span class="flow-packet"></span><span class="flow-arrow">→</span></span>` : ''}`;
    }).join('');
    return `<section class="work-page" aria-labelledby="work-title">
      <p class="eyebrow">РАБОТА КОМАНДЫ · ШАГ 3</p><h1 class="page-title" id="work-title">Как команда <em>собирает результат.</em></h1>
      <p class="lead">Схема показывает, как общий контекст и выводы переходят между этапами согласованного плана.</p>
      <div class="work-honesty" role="note"><strong>Схема работы · демо</strong><span>Подсветка показывает этапы плана. Агенты не запускались; факты и выводы не проверялись.</span></div>
      <div class="flow-board" aria-label="Схема передачи информации между ролями"><div class="flow-board-head"><strong>Как движется результат</strong><span>Этап ${visible} из ${agreedPlan.length}</span></div><div class="flow-map">${flow}</div></div>
      <div class="flow-current" role="status"><span class="flow-current-symbol" aria-hidden="true">✳</span><div><small>СЕЙЧАС В СХЕМЕ · ${esc(current.roles?.length ? current.roles.join(' · ') : 'роль не назначена')}</small><strong>${esc(current.title)}</strong><p>${esc(current.detail)}. ${visible === agreedPlan.length ? 'Выход по плану — итоговый файл.' : 'Выход по плану — вводные для следующего этапа.'}</p></div></div>
      <div class="work-footer"><button class="button secondary" data-action="back-to-team">← Вернуться к команде и плану</button>${visible < agreedPlan.length ? `<button class="button primary" data-action="next-work-step">Показать передачу дальше →</button>` : `<button class="button primary" data-action="to-result">Завершить и открыть результат →</button>`}</div>
    </section>`;
  }

  function resultSections(version) {
    const data = version.snapshot;
    const focus = data.answer === 'Пока не знаю' || !data.answer
      ? 'главное направление проверки пока не выбрано'
      : data.answer.trim().slice(0, 180);
    const firstAction = data.answer === 'Пока не знаю' || !data.answer
      ? 'Выбрать один главный критерий решения и назвать, какой факт его подтвердит.'
      : data.role === 'implementer'
        ? 'Подготовить минимальный технический сценарий, входные данные и критерий успеха.'
        : 'Уточнить критерий решения и собрать первый проверяемый факт с указанием источника.';
    return [
      {
        title: 'Карта гипотез',
        teaser: 'Что предполагаем и чего пока не знаем',
        lines: [
          `Продуктовое решение: ${data.brief}`,
          `Фокус: ${focus}.`,
          ...(version.n > 1 ? [`Новое условие: ${version.changed}.`] : []),
          'Статус: гипотеза не проверена; подтверждений в этом макете нет.'
        ]
      },
      {
        title: 'План проверки',
        teaser: 'В каком порядке собирать основания',
        lines: [
          ...(Array.isArray(data.plan) && data.plan.length
            ? data.plan.map((step, index) => `${index + 1}. ${step.title}: ${step.detail}. Участвуют: ${(step.roles || []).join(', ') || 'не назначены'}.`)
            : ['1. Уточнить известные данные и ограничения.', `2. Проверить выбранный фокус: ${focus}.`, '3. Сравнить варианты и зафиксировать основания решения.']),
          ...(version.n > 1 ? [`Перед запуском обновить проверку с учётом условия: ${version.changed}.`] : [])
        ]
      },
      {
        title: 'Первый шаг',
        teaser: 'Краткий бриф первой проверки',
        lines: [
          `Цель: получить первый проверяемый ответ по теме «${focus}».`,
          `Действие: ${firstAction}`,
          ...(version.n > 1 ? [`Условие первой проверки: ${version.changed}.`] : []),
          'Выход: наблюдение или измерение, источник и решение о следующей проверке.'
        ]
      }
    ];
  }

  function skillPanel(version) {
    const saved = state.skills.find(item => item.version === version.n);
    const previous = version.n !== state.versions[state.versions.length - 1]?.n;
    return `<div class="result-skill-artifact" id="skill-panel" aria-label="Скилл для задачи">
      <div class="result-skill-head"><span class="result-skill-icon" aria-hidden="true">ZIP</span><div><strong>Скилл для задачи · версия ${version.n}</strong><small>${saved ? `Черновик сохранён в этом браузере · ${esc(saved.date)}${previous ? ' · предыдущая версия' : ''}` : 'Черновик ещё не собран'}</small></div></div>
      <p>Внутри: SKILL.md, шаблоны проверки и отчёт по задаче.</p>
      <div class="skill-actions">${saved ? `<a class="button secondary small" href="?skill=${version.n}&project=${encodeURIComponent(state.projectId)}" target="_blank" rel="noopener">Посмотреть SKILL.md</a><button class="button primary small" data-action="download-skill" data-version="${version.n}">Скачать архив скилла</button>` : `<button class="button primary small" data-action="save-skill">Собрать черновик скилла</button>`}</div>
      <p class="helper">Архив собран локально по шаблону. Скилл ещё не проверен пробным запуском.</p>
    </div>`;
  }

  function resultPage() {
    const current = state.versions[state.versions.length - 1];
    const isSkill = state.role === 'implementer' && state.outputType === 'skill';
    const savedSkill = [...state.skills].reverse().map(item => state.versions.find(version => version.n === item.version)).find(Boolean);
    const visibleSkill = isSkill ? current : savedSkill;
    return `<section class="${visibleSkill ? 'with-skill' : ''}" aria-labelledby="result-title">
      <p class="eyebrow">РЕЗУЛЬТАТ · ШАГ 4</p><h1 class="result-title" id="result-title">${isSkill ? 'Скилл для задачи' : 'Результат по задаче'}</h1><p class="result-subtitle">${isSkill ? 'Откройте черновик SKILL.md или скачайте архив для проверки в совместимой среде.' : 'Откройте документ в отдельном окне или скачайте его.'}</p>
      ${state.notice && !(isSkill && state.skills.some(item => item.version === current.n)) ? `<p class="result-update" role="status">${esc(state.notice)}</p>` : ''}
      ${visibleSkill ? skillPanel(visibleSkill) : ''}
      <div class="result-dashboard"><div class="result-dialog">${facilitatorChat('result')}</div><div class="result-files">
        <div class="artifact result-artifact"><div class="artifact-head"><div class="artifact-icon">${state.format.toUpperCase()}</div><div><strong>${isSkill ? 'Короткий отчёт' : 'Результат по задаче'} · версия ${current.n}</strong><small>${esc(current.date)} · текущая · черновик в этом браузере</small><span class="artifact-contents">Внутри: карта гипотез · план проверки · первый шаг</span></div></div><div class="artifact-actions"><a class="button secondary small" href="?preview=${current.n}&project=${encodeURIComponent(state.projectId)}" target="_blank" rel="noopener">Посмотреть версию</a></div></div>
        <div class="export-bar"><div><strong>Файл результата</strong><span>Выберите формат и скачайте свою версию</span></div><div class="format-grid" role="group" aria-label="Формат скачиваемого файла">${['pdf', 'docx', 'pptx', 'xlsx', 'md'].map(format => `<button class="format-option ${state.format === format ? 'active' : ''}" data-action="format" data-format="${format}" aria-pressed="${state.format === format}">${format.toUpperCase()}</button>`).join('')}</div><button class="button primary" data-action="download-version" data-version="${current.n}">Скачать ${state.format.toUpperCase()}</button></div>
        <p class="result-caption">Файл создаётся в браузере по шаблону CoreTeams. Это макет без анализа файлов, запуска агентов и серверного сохранения.</p>
      </div></div>
      <button class="button ghost small" data-action="toggle-versions">${state.showVersions ? 'Скрыть сохранённые версии' : 'Открыть все сохранённые версии'} →</button>
        ${state.showVersions ? `<div class="version-list">${[...state.versions].reverse().map((version, index) => `<div class="version-row"><div><strong>Версия ${version.n} <span class="badge ${index === 0 ? 'green' : ''}">${index === 0 ? 'текущая' : 'предыдущая'}</span></strong><small>${esc(version.date)} · ${esc(version.changed)}${state.skills.some(item => item.version === version.n) ? ' · скилл сохранён' : ''}</small></div><div class="version-actions"><a class="button secondary small" href="?preview=${version.n}&project=${encodeURIComponent(state.projectId)}" target="_blank" rel="noopener">Посмотреть версию</a><button class="button secondary small" data-action="download-version" data-version="${version.n}">Скачать ${state.format.toUpperCase()}</button>${state.skills.some(item => item.version === version.n) ? `<button class="button secondary small" data-action="download-skill" data-version="${version.n}">Скачать ZIP-макет</button>` : ''}</div></div>`).join('')}</div>` : ''}
      <div class="result-followup surface"><div><p class="section-kicker">СЛЕДУЮЩИЙ ШАГ</p><h2 class="section-title">${isSkill ? 'Проверьте скилл на тестовой задаче' : 'Проверьте первый шаг из документа'}</h2><p class="helper">${isSkill ? 'Скачайте архив скилла и выполните пробный запуск в совместимой среде; результат расскажите фасилитатору выше.' : 'Расскажите фасилитатору выше, что удалось узнать: он поможет подготовить следующую версию.'}</p></div></div>
    </section>`;
  }

    }
    if (action === 'confirm-delete') {
      const project = library.find(item => item.id === pendingDeleteId && item.status === 'active');
      if (!project) return announce('Проект уже удалён или недоступен.');
      project.status = 'trash';
      project.deletedAt = new Date().toISOString();
      if (state.projectId === project.id) {
        state = { ...fresh(), ...(activeProjects().sort((a, b) => Date.parse(b.updatedAt) - Date.parse(a.updatedAt))[0]?.state || {}) };
        selectedFile = null;
      }
      pendingDeleteId = null;
      dialogReturn = null;
      state.dialog = null;
      persist(); render();
      app.querySelector('[data-action="show-projects"]')?.focus();
      announce('Проект перемещён в корзину на 30 дней. Его можно восстановить.');
      return;
    }
    if (action === 'restore-project') {
      if (activeProjects().length >= PROJECT_LIMIT) return announce('Достигнут лимит 5 активных проектов. Сначала удалите один из них.');
      const project = library.find(item => item.id === button.dataset.projectId && item.status === 'trash');
      if (!project) return announce('Проект не найден в корзине.');
      project.status = 'active'; delete project.deletedAt;
      project.updatedAt = new Date().toISOString();
      try { localStorage.setItem(LIBRARY_KEY, JSON.stringify(library)); } catch { return announce('Не удалось восстановить проект в этом браузере.'); }
      render(); announce('Проект восстановлен вместе с версиями.');
      return;
    }
    if (action === 'select-role') {
      const changed = state.role !== button.dataset.role;
      set({ role: button.dataset.role, answer: changed ? '' : state.answer, context: changed ? '' : state.context, dialogue: changed ? [] : state.dialogue, dialogueDraft: '', resultDialogue: changed ? [] : state.resultDialogue, resultDialogueDraft: '', extraRoles: changed ? [] : state.extraRoles, planEdits: changed ? {} : state.planEdits, showPlanForm: false, versions: changed ? [] : state.versions, skills: changed ? [] : state.skills, outputType: changed ? 'document' : state.outputType });
      document.getElementById('brief-section')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      document.getElementById('brief')?.focus({ preventScroll: true });
      return;
    }
    if (action === 'example') {
      const example = role()?.examples[Number(button.dataset.index)];
      if (example) { state.brief = example; persist(); render(); document.getElementById('brief')?.focus(); }
      return;
    }
    if (action === 'start-work') {
      const value = document.getElementById('brief')?.value.trim() || '';
      if (!state.role) return announce('Сначала выберите роль в проекте.');
      if (value.length < 12) {
        const error = document.getElementById('start-error');
        if (error) error.textContent = 'Назовите продукт и решение чуть подробнее.';
        return;
      }
      set({ brief: value, stage: 'workspace' });
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    if (action === 'to-team') {
      if (state.dialogue.length < 4) return announce('Ответьте на четыре основных вопроса фасилитатора.');
      set({ stage: 'team' });
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    if (action === 'chat-unknown') return addChatAnswer(button.dataset.kind, 'Пока не знаю');
    if (action === 'create-next-version') {
      if (state.resultDialogue.length < 3) return announce('Сначала ответьте на три вопроса о следующей версии.');
      const n = state.versions.length + 1;
      const changed = state.resultDialogue[0].answer.trim().slice(0, 120) || 'Уточнён результат';
      const version = createVersion(n, changed);
      const record = state.role === 'implementer' && state.outputType === 'skill' ? createSkillRecord(version) : null;
      const skills = record && validSkillRecord(record) ? [...state.skills, record] : state.skills;
      set({ versions: [...state.versions, version], skills, resultDialogue: [], resultDialogueDraft: '', notice: `Версия ${n} добавлена в этот браузер. Версия ${n - 1} остаётся доступной.` });
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    if (action === 'show-role-form') return set({ showRoleForm: !state.showRoleForm });
    if (action === 'edit-plan') return set({ showPlanForm: true });
    if (action === 'cancel-plan-edit') return set({ showPlanForm: false });
    if (action === 'back-to-questions') { set({ stage: 'workspace', showPlanForm: false, showRoleForm: false }); return; }
    if (action === 'output-type' && state.role === 'implementer' && ['document', 'skill'].includes(button.dataset.outputType)) return set({ outputType: button.dataset.outputType });
    if (action === 'format') return set({ format: button.dataset.format });
    if (action === 'confirm-plan') {
      if (state.showPlanForm) return announce('Сначала завершите редактирование плана.');
      const previous = state.versions.at(-1);
      const oldPlan = previous?.snapshot.plan || (previous ? defaultPlanSteps(previous.snapshot.role, previous.snapshot.extraRoles || []) : []);
      const planChanged = previous && JSON.stringify(oldPlan) !== JSON.stringify(currentPlanSteps());
      const outputChanged = previous && ((previous.snapshot.outputType || 'document') !== state.outputType || (previous.snapshot.format || 'pdf') !== state.format);
      const versions = !previous ? [createVersion(1, 'Первая версия плана')]
        : planChanged || outputChanged ? [...state.versions, createVersion(state.versions.length + 1, planChanged ? 'Изменён состав команды или план проверки' : 'Изменён тип или формат результата')]
          : state.versions;
      set({ versions, stage: 'work', workStep: !previous || planChanged || outputChanged ? 1 : state.workStep || 1 });
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    if (action === 'next-work-step') return set({ workStep: Math.min((state.workStep || 1) + 1, state.versions.at(-1)?.snapshot?.plan?.length || currentPlanSteps().length) });
    if (action === 'back-to-team') return set({ stage: 'team' });
    if (action === 'to-result') {
      const current = state.versions.at(-1);
      const needsSkill = state.role === 'implementer' && state.outputType === 'skill' && current && !state.skills.some(item => item.version === current.n);
      const record = needsSkill ? createSkillRecord(current) : null;
      const skills = record && validSkillRecord(record) ? [...state.skills, record] : state.skills;
      set({ stage: 'result', skills }); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
    }
    if (action === 'toggle-versions') return set({ showVersions: !state.showVersions });
    if (action === 'download-version') return downloadVersion(button.dataset.version);
    if (action === 'save-skill') {
      const current = state.versions.at(-1);
      if (state.role !== 'implementer' || state.outputType !== 'skill' || !current) return announce('Сначала выберите создание скилла и согласуйте план.');
      const record = createSkillRecord(current);
      if (!validSkillRecord(record)) return announce('Не удалось собрать архив скилла.');
      set({ skills: [...state.skills.filter(item => item.version !== current.n), record], notice: '' });
      announce('Скилл сохранён в проекте локально. Пробный запуск не проводился.');
      return;
    }
    if (action === 'download-skill') return downloadSkill(button.dataset.version);
    if (action === 'select-file') { document.getElementById('source-file')?.click(); return; }
    if (action === 'open-save' || action === 'open-register') { dialogReturn = { action }; return set({ dialog: 'save', accountMode: 'register' }); }
    if (action === 'account-mode') return set({ accountMode: button.dataset.mode === 'login' ? 'login' : 'register' });
    if (action === 'close-dialog') {
      const target = dialogReturn;
      pendingDeleteId = null; dialogReturn = null; set({ dialog: null });
      const selector = target?.id ? `[data-action="${target.action}"][data-project-id="${CSS.escape(target.id)}"]` : `[data-action="${target?.action}"]`;
      app.querySelector(selector)?.focus();
      return;
    }
    if (action === 'toggle-aside') return set({ asideCollapsed: !state.asideCollapsed });
    if (action === 'new-project') {
      if (activeProjects().length >= PROJECT_LIMIT) { view = 'projects'; render(); return announce('Можно иметь не более 5 активных проектов. Удалите один из них, чтобы начать новый.'); }
      state = fresh(); selectedFile = null; view = 'workspace'; persist(); render(); window.scrollTo(0, 0);
      return;
    }
  });

  document.addEventListener('input', event => {
    if (event.target.id === 'brief') { state.brief = event.target.value; persist(); }
    if (event.target.id === 'initial-chat-input') { state.dialogueDraft = event.target.value; persist(); }
    if (event.target.id === 'result-chat-input') { state.resultDialogueDraft = event.target.value; persist(); }
    if (event.target.id === 'account-pass' || event.target.id === 'account-pass-repeat') document.getElementById('account-pass-repeat')?.setCustomValidity('');
  });
  document.addEventListener('change', event => {
    if (event.target.id === 'source-file') {
      selectedFile = event.target.files?.[0]?.name || null;
      const label = document.getElementById('file-status');
      if (label) {
        label.hidden = !selectedFile;
        label.textContent = selectedFile ? `Выбран: ${selectedFile}. Файл не загружен и не анализировался.` : '';
      }
    }
  });
  document.addEventListener('submit', event => {
    if (event.target.id === 'initial-chat-form' || event.target.id === 'result-chat-form') {
      event.preventDefault();
      const kind = event.target.id === 'initial-chat-form' ? 'initial' : 'result';
      const value = event.target.querySelector('textarea')?.value;
      addChatAnswer(kind, value);
      return;
    }
    if (event.target.id === 'role-form') {
      event.preventDefault();
      const name = event.target.elements.namedItem('roleName')?.value.trim() || '';
      const task = event.target.elements.namedItem('roleTask')?.value.trim() || '';
      if (!name || !task) return;
      const names = [...roleInfo[state.role].team.map(item => item[0]), ...state.extraRoles.map(item => item.name)];
      if (names.some(item => item.toLocaleLowerCase('ru-RU') === name.toLocaleLowerCase('ru-RU'))) return announce('Такая роль уже есть в команде. Уточните название.');
      const planEdits = { ...state.planEdits };
      if (planEdits[1]?.roles) planEdits[1] = { ...planEdits[1], roles: [...planEdits[1].roles, name] };
      set({ extraRoles: [...state.extraRoles, { name, task }], planEdits, showRoleForm: false });
      announce(`Роль «${name}» добавлена в состав макета. Агент не запускался.`);
    }
    if (event.target.id === 'plan-form') {
      event.preventDefault();
      const edits = {};
      for (let index = 0; index < 3; index++) {
        const title = event.target.elements.namedItem(`plan-title-${index}`)?.value.trim() || '';
        const detail = event.target.elements.namedItem(`plan-detail-${index}`)?.value.trim() || '';
        const roles = [...event.target.querySelectorAll(`[name="plan-role-${index}"]:checked`)].map(input => input.value);
        if (!title || !detail || !roles.length) return announce(`Укажите название, действие и хотя бы одну роль для шага ${index + 1}.`);
        edits[index] = { title, detail, roles };
      }
      set({ planEdits: edits, showPlanForm: false });
      announce('План обновлён в этом браузере. Роли учтены в шагах.');
      return;
    }
    if (event.target.id === 'account-form') {
      event.preventDefault();
      if (state.accountMode !== 'login' && event.target.querySelector('#account-pass')?.value !== event.target.querySelector('#account-pass-repeat')?.value) {
        event.target.querySelector('#account-pass-repeat')?.setCustomValidity('Пароли не совпадают');
        event.target.querySelector('#account-pass-repeat')?.reportValidity();
        return;
      }
      event.target.reset();
      announce('Это макет: аккаунт и серверное сохранение не выполняются.');
    }
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && event.target.matches?.('#initial-chat-input, #result-chat-input')) {
      event.preventDefault();
      event.target.form?.requestSubmit();
      return;
    }
    if (!state.dialog) return;
    if (event.key === 'Escape') {
      event.preventDefault();
      app.querySelector('.dialog-close')?.click();
    }
    if (event.key === 'Tab') {
      const controls = [...app.querySelectorAll('.dialog button, .dialog input, .dialog a')];
      if (!controls.length) return;
      if (event.shiftKey && document.activeElement === controls[0]) { event.preventDefault(); controls.at(-1).focus(); }
      if (!event.shiftKey && document.activeElement === controls.at(-1)) { event.preventDefault(); controls[0].focus(); }
    }
  });

  const openId = new URLSearchParams(location.search).get('open');
  if (openId) {
    const project = library.find(item => item.id === openId && item.status === 'active');
    if (project) state = { ...fresh(), ...project.state, dialog: null };
    history.replaceState(null, '', location.pathname);
  }
  persist();
  render();
})();

</script>
</body>
</html>
